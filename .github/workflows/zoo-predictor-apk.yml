name: Build Zoo Roulette Predictor APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ZooRoulettePredictor/**'
      - '.github/workflows/zoo-predictor-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p ZooRoulettePredictor assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZooRoulettePredictor-APK
          path: ZooRoulettePredictor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
