<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wild Pearl Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29a9c7,#075078 60%,#061d35);color:#fff;font-family:Arial,sans-serif}.top{display:flex;align-items:center;gap:10px;padding:9px;background:#063957;border-bottom:2px solid #4de0ed;flex-wrap:wrap}.avatar{font-size:35px;border-radius:50%;background:#e5a64d;padding:4px}.pill{background:#12678b;border:1px solid #7ee7f0;border-radius:20px;padding:8px 12px}.gold{color:#ffe17b}.wrap{padding:14px;max-width:1200px;margin:auto}.ticker{text-align:center;padding:10px;background:#084469;border-radius:12px;color:#ffe69a;margin-bottom:12px}.layout{display:grid;grid-template-columns:140px 1fr;gap:12px}.side{display:flex;flex-direction:column;gap:9px;background:#084366;padding:10px;border-radius:14px}.side button{background:linear-gradient(#54c9e4,#12638e);color:white}.games{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}.game{border:2px solid #80e4f0;border-radius:15px;background:linear-gradient(150deg,#22a6c4,#07456d);min-height:125px;display:grid;place-content:center;text-align:center;gap:8px;cursor:pointer;box-shadow:0 4px 8px #001a33}.emoji{font-size:42px}.game b{font-size:15px;text-shadow:0 2px 3px #002}.bottom{display:flex;justify-content:space-around;flex-wrap:wrap;background:#073b60;margin-top:13px;padding:14px;border-radius:14px;color:#ffe18a}.screen{background:#082b48;border:2px solid #d7b15c;border-radius:15px;padding:12px}.hide{display:none!important}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:800px;margin:12px auto}.animal{background:#123c59;border:2px solid #c9a34e;border-radius:10px;padding:9px 3px;text-align:center;cursor:pointer}.animal.sel{outline:3px solid #51ef9e;background:#176b60}.animal span{display:block;font-size:28px}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px}button{border:0;border-radius:10px;padding:9px 13px;font-weight:bold;background:linear-gradient(#ffe58a,#d99526);color:#402400;cursor:pointer}.green{background:linear-gradient(#7df3ae,#15965d);color:#063}.result{background:#073d5c;border:1px solid #4ac9e3;border-radius:10px;text-align:center;padding:12px;margin:10px auto;max-width:750px}.log{font-size:12px;max-height:75px;overflow:auto;color:#bcecf4}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(4,1fr)}.side b{grid-column:1/-1}.games{grid-template-columns:repeat(2,1fr)}.game{min-height:105px}.board{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="top"><div class="avatar">🧑🏻‍🚀</div><div><b>Guest Player</b><div style="font-size:12px">Offline practice account</div></div><div class="pill">🪙 Coins: <b class="gold" id="coins">1000</b></div><div class="pill">🎁 Bonus: <b class="gold">Demo</b></div><button onclick="bonus()">Daily Bonus +200</button></header>
<main class="wrap"><div class="ticker">✨ WILD PEARL · OFFLINE ARCADE · VIRTUAL COINS ONLY</div><section id="home"><div class="layout"><aside class="side"><b>GAME SORTS</b><button onclick="filter('All')">🎮 All</button><button onclick="filter('Players')">👥 Players</button><button onclick="filter('Skill')">🃏 Skill</button><button onclick="filter('Slots')">🎰 Slots</button></aside><div class="games" id="games"></div></div><div class="bottom">🎁 Refer & Earn　　📢 Notice　　↗ Share　　🏆 Rank　　🔐 Safe　　🛍 Shop</div></section>
<section id="play" class="screen hide"><div class="controls"><button onclick="home()">← Lobby</button><h2 id="title" class="gold">Zoo Roulette</h2><span class="pill">🪙 <b id="coins2">1000</b></span></div><div id="content"></div><div class="result">DEMO ONLY · All outcomes are random and generated on this device.</div></section></main>
<script>
const catalog=[['Tiger Dragon','🐯','Players'],['Mines','💣','Skill'],['7 Up Down','🎲','Players'],['Crash','🚀','Players'],['777 Bingo','🎰','Slots'],['Poker Mines','🃏','Skill'],['Zoo Roulette','🦁','Players'],['Roulette','🎡','Players'],['Car Roulette','🏎️','Players'],['Sweet Bonanza','🍭','Slots']];
const animals=[['Monkey','🐒',8],['Rabbit','🐇',8],['Lion','🦁',12],['Panda','🐼',8],['Shark','🦈',24],['Bird','🦅',2],['Swallow','🐦',6],['Pigeon','🕊️',8],['Peacock','🦚',12],['Eagle','🦅',12]];
let coins=+(localStorage.wpCoins||1000),history=JSON.parse(localStorage.wpHistory||'[]'),bet=20,selected='Lion',current='Zoo Roulette',choice='';
function save(){localStorage.wpCoins=coins;localStorage.wpHistory=JSON.stringify(history.slice(0,30));document.getElementById('coins').textContent=coins;document.getElementById('coins2').textContent=coins}
function render(list=catalog){games.innerHTML=list.map(([n,e])=>'<div class="game" onclick="openGame(\''+n+'\')"><div class="emoji">'+e+'</div><b>'+n+'</b></div>').join('')}
function filter(c){render(c==='All'?catalog:catalog.filter(x=>x[2]===c))}
function home(){play.classList.add('hide');document.getElementById('home').classList.remove('hide')}
function openGame(n){current=n;document.getElementById('home').classList.add('hide');play.classList.remove('hide');title.textContent=n;draw()}
function draw(){let html='';if(current==='Zoo Roulette'){html='<div class="result"><h2>🦁 ZOO ROULETTE</h2>Choose an animal and play a local practice round.</div><div class="board">'+animals.map(([n,e,m])=>'<div class="animal '+(n===selected?'sel':'')+'" onclick="pick(\''+n+'\')"><span>'+e+'</span><b>'+n+' ×'+m+'</b></div>').join('')+'</div>'}else{let opts=current==='Tiger Dragon'?['Tiger','Dragon']:current==='7 Up Down'?['Under 7','Over 7']:current==='Roulette'?['Red','Black','Green']:current==='Car Roulette'?['Red car','Blue car','Gold car']:current==='Sweet Bonanza'?['Red','Purple','Yellow']:current==='Crash'?['1.5×','2×','3×']:current==='777 Bingo'?['1','2','3','4','5','6','7']:['Card 1','Card 2','Card 3','Card 4'];html='<div class="result"><h2>'+current+'</h2>Select an option for a virtual-coin practice round.</div><div class="controls">'+opts.map(x=>'<button onclick="playChoice(\''+x+'\')">'+x+'</button>').join('')+'</div>'}html+='<div class="controls">'+[20,50,100,200,500].map(v=>'<button class="'+(bet===v?'green':'')+'" onclick="bet='+v+';draw()">'+v+' coins</button>').join('')+'</div><div class="controls"><button class="green" onclick="'+(current==='Zoo Roulette'?'playZoo()':'alert(\'Choose one of the options above to play.\')')+'">PLAY ROUND</button><button onclick="bonus()">Daily bonus</button></div><div class="result" id="result">Select and play. Virtual coins only.</div><div class="result"><b>Recent results</b><div class="log">'+history.slice(0,10).join(' · ')+'</div></div>';content.innerHTML=html;save()}
function pick(n){selected=n;draw()}
function settle(line,win,prize){history.unshift(line);document.getElementById('result').innerHTML=(win?'🎉 WIN +':'Round result · ')+(win?prize:'No win');save()}
function playZoo(){if(coins<bet){alert('Not enough coins. Claim daily bonus.');return}coins-=bet;let w=animals[Math.floor(Math.random()*animals.length)],win=w[0]===selected,p=win?bet*w[2]:0;coins+=p;settle(w[1]+' '+w[0],win,p)}
function playChoice(v){if(coins<bet){alert('Not enough coins. Claim daily bonus.');return}coins-=bet;let opts=current==='Tiger Dragon'?['Tiger','Dragon']:current==='7 Up Down'?['Under 7','Over 7']:current==='Roulette'?['Red','Black','Green']:current==='Car Roulette'?['Red car','Blue car','Gold car']:current==='Sweet Bonanza'?['Red','Purple','Yellow']:current==='Crash'?['1.5×','2×','3×']:current==='777 Bingo'?['1','2','3','4','5','6','7']:['Card 1','Card 2','Card 3','Card 4'];let out=opts[Math.floor(Math.random()*opts.length)],win=out===v,p=win?bet*(current==='Roulette'&&v==='Green'?5:2):0;coins+=p;settle(current+': '+out,win,p)}
function bonus(){coins+=200;save();alert('200 virtual demo coins added!')}
render();save();
</script></body></html>
