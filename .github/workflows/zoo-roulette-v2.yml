name: Build Zoo Roulette V2 APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "ZooRouletteV2/**"
      - ".github/workflows/zoo-roulette-v2.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZooRouletteV2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zoo-Roulette-V2-debug-apk
          path: ZooRouletteV2/app/build/outputs/apk/debug/app-debug.apk